  subcontract: [分包, 分包商, 禁止分包, 允许分包, 转包, 违法分包, 专业分包]
  submission: [投标截止, 投标文件递交, 响应文件递交, 提交响应文件截止, 提交截止, 递交截止, 上传截止, 递交地点, 提交地点, 送达, 上传, 加密, 递交方式]
