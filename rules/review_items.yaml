# Retrieval configuration for the user-facing review template.
# The text in the workbook remains the review intent; these families are only
# deterministic recall seeds and are deliberately not a closed vocabulary.
# Round 5.5: the review workbook's substantive rows are generated from the
# tender document's own source requirements
# (tender_basic/dynamic_requirements.py -> tender_basic/dynamic_review.py), so
# this file is a topic/recall aid and no longer determines the row count.
families:
